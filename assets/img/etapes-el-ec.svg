<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img"><title>Etapes de l'economia lineal (recta) i de la circular (cicle que torna al principi)</title><rect width="900" height="520" fill="#f7fbf5"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">Etapes de l'economia lineal i de la circular</text><text x="30" y="95" font-size="18" font-weight="700" fill="#6b7a70">Economia lineal</text><rect x="30" y="110" width="165" height="62" rx="12" fill="#7d8f83"/><text x="112.5" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Extreure</text><rect x="255" y="110" width="165" height="62" rx="12" fill="#7d8f83"/><text x="337.5" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Produir</text><rect x="480" y="110" width="165" height="62" rx="12" fill="#7d8f83"/><text x="562.5" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Consumir</text><rect x="705" y="110" width="165" height="62" rx="12" fill="#4f5b53"/><text x="787.5" y="147" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Llençar</text><path d="M200 141H252" stroke="#4d6356" stroke-width="3" fill="none"/><path d="M243 133L252 141L243 149" stroke="#4d6356" stroke-width="3" fill="none"/><path d="M425 141H477" stroke="#4d6356" stroke-width="3" fill="none"/><path d="M468 133L477 141L468 149" stroke="#4d6356" stroke-width="3" fill="none"/><path d="M650 141H702" stroke="#4d6356" stroke-width="3" fill="none"/><path d="M693 133L702 141L693 149" stroke="#4d6356" stroke-width="3" fill="none"/><text x="30" y="212" font-size="14" fill="#4d6356">Cada producte comença amb matèria primera nova i acaba a l'abocador.</text><text x="30" y="270" font-size="18" font-weight="700" fill="#2e7d4f">Economia circular</text><rect x="30" y="285" width="165" height="62" rx="12" fill="#2e7d4f"/><text x="112.5" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Dissenyar</text><rect x="255" y="285" width="165" height="62" rx="12" fill="#2e7d4f"/><text x="337.5" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Produir</text><rect x="480" y="285" width="165" height="62" rx="12" fill="#2e7d4f"/><text x="562.5" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Consumir</text><rect x="705" y="285" width="165" height="62" rx="12" fill="#2e7d4f"/><text x="787.5" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Reutilitzar</text><path d="M200 316H252" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M243 308L252 316L243 324" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M425 316H477" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M468 308L477 316L468 324" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M650 316H702" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M693 308L702 316L693 324" stroke="#2e7d4f" stroke-width="3" fill="none"/><rect x="480" y="400" width="165" height="62" rx="12" fill="#8fc46b"/><text x="562.5" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#12392a">Reciclar</text><path d="M787 347V431H650" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M659 423L650 431L659 439" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M480 431H112V352" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M104 361L112 350L120 361" stroke="#2e7d4f" stroke-width="3" fill="none"/><text x="30" y="500" font-size="14" fill="#4d6356">Els materials tornen al cicle: s'allarga la vida del producte i es redueixen els residus.</text></g></svg>
