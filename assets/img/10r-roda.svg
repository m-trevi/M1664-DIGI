<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img"><title>Les 10 R de l'economia circular, ordenades de la més circular a la menys circular</title><rect width="800" height="570" fill="#f7fbf5"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">Les 10 R de l'economia circular</text><circle cx="400" cy="285" r="150" fill="none" stroke="#cfdecb" stroke-width="3" stroke-dasharray="6 6"/><circle cx="400" cy="135" r="30" fill="#0f3a29"/><text x="400" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text><text x="400" y="76" text-anchor="middle" font-size="17" font-weight="600" fill="#16261d">Rebutjar</text><circle cx="488" cy="164" r="30" fill="#17503a"/><text x="488" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text><text x="516" y="127" text-anchor="start" font-size="17" font-weight="600" fill="#16261d">Repensar</text><circle cx="543" cy="239" r="30" fill="#1f6a47"/><text x="543" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text><text x="588" y="228" text-anchor="start" font-size="17" font-weight="600" fill="#16261d">Reduir</text><circle cx="543" cy="331" r="30" fill="#2a7f52"/><text x="543" y="339" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text><text x="588" y="352" text-anchor="start" font-size="17" font-weight="600" fill="#16261d">Reutilitzar</text><circle cx="488" cy="406" r="30" fill="#3d9459"/><text x="488" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">5</text><text x="516" y="453" text-anchor="start" font-size="17" font-weight="600" fill="#16261d">Reparar</text><circle cx="400" cy="435" r="30" fill="#5aa760"/><text x="400" y="443" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">6</text><text x="400" y="500" text-anchor="middle" font-size="17" font-weight="600" fill="#16261d">Recondicionar</text><circle cx="312" cy="406" r="30" fill="#79b868"/><text x="312" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">7</text><text x="284" y="453" text-anchor="end" font-size="17" font-weight="600" fill="#16261d">Remanufacturar</text><circle cx="257" cy="331" r="30" fill="#98c874"/><text x="257" y="339" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">8</text><text x="212" y="352" text-anchor="end" font-size="17" font-weight="600" fill="#16261d">Replantejar</text><circle cx="257" cy="239" r="30" fill="#b4d78a"/><text x="257" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">9</text><text x="212" y="228" text-anchor="end" font-size="17" font-weight="600" fill="#16261d">Reciclar</text><circle cx="312" cy="164" r="30" fill="#cde5a8"/><text x="312" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">10</text><text x="284" y="127" text-anchor="end" font-size="17" font-weight="600" fill="#16261d">Recuperar</text><text x="400" y="279" text-anchor="middle" font-size="26" font-weight="700" fill="#2e7d4f">10 R</text><text x="400" y="303" text-anchor="middle" font-size="14" fill="#4d6356">Com més amunt a la</text><text x="400" y="321" text-anchor="middle" font-size="14" fill="#4d6356">llista, més circular</text></g></svg>
