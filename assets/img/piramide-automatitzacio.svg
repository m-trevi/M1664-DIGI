<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img"><title>Piràmide d'automatització: de sensors i actuadors a l'ERP; les dades pugen i les ordres baixen</title><rect width="900" height="440" fill="#f7fbf5"/><g font-family="Segoe UI,Helvetica,Arial,sans-serif"><text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12392a">Piràmide de l'automatització industrial</text><rect x="260.0" y="70" width="300" height="62" rx="10" fill="#12392a"/><text x="410.0" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Nivell 4 · Empresa</text><text x="410.0" y="118" text-anchor="middle" font-size="14" fill="#e8f4e3">ERP: comandes, finances, planificació</text><rect x="212.5" y="142" width="395" height="62" rx="10" fill="#1f6a47"/><text x="410.0" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Nivell 3 · Operacions</text><text x="410.0" y="190" text-anchor="middle" font-size="14" fill="#e8f4e3">MES: ordres de fabricació i qualitat</text><rect x="165.0" y="214" width="490" height="62" rx="10" fill="#2e7d4f"/><text x="410.0" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Nivell 2 · Supervisió</text><text x="410.0" y="262" text-anchor="middle" font-size="14" fill="#e8f4e3">SCADA i HMI: veure i controlar la planta</text><rect x="117.5" y="286" width="585" height="62" rx="10" fill="#5aa760"/><text x="410.0" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Nivell 1 · Control</text><text x="410.0" y="334" text-anchor="middle" font-size="14" fill="#e8f4e3">PLC: executa el programa</text><rect x="70.0" y="358" width="680" height="62" rx="10" fill="#8fc46b"/><text x="410.0" y="384" text-anchor="middle" font-size="16" font-weight="700" fill="#12392a">Nivell 0 · Camp</text><text x="410.0" y="406" text-anchor="middle" font-size="14" fill="#12392a">Sensors i actuadors: mesuren i actuen</text><path d="M830 400V90" stroke="#2e7d4f" stroke-width="3" fill="none"/><path d="M820 102L830 90L840 102" stroke="#2e7d4f" stroke-width="3" fill="none"/><text x="822" y="250" font-size="14" font-weight="700" fill="#2e7d4f" transform="rotate(-90 822 250)" text-anchor="middle">dades</text><path d="M870 90V400" stroke="#12392a" stroke-width="3" fill="none"/><path d="M860 388L870 400L880 388" stroke="#12392a" stroke-width="3" fill="none"/><text x="862" y="250" font-size="14" font-weight="700" fill="#12392a" transform="rotate(-90 862 250)" text-anchor="middle">ordres</text></g></svg>
